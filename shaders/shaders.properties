# Gloamlight shader pack configuration

# --- Vanilla feature toggles -------------------------------------------------
oldLighting=false
oldHandLight=false
separateAo=false
underwaterOverlay=false
vignette=false
sun=false
moon=true
#ifdef VANILLA_CLOUDS
clouds=fancy
#else
clouds=off
#endif

# --- Pass toggles --------------------------------------------------------------
program.world-1/shadow.enabled=false
program.composite2.enabled=BLOOM
program.composite3.enabled=BLOOM
program.world-1/composite2.enabled=BLOOM
program.world-1/composite3.enabled=BLOOM
program.world1/composite2.enabled=BLOOM
program.world1/composite3.enabled=BLOOM

# --- Blending -------------------------------------------------------------------
# Forward-shaded geometry accumulates premultiplied color + coverage in colortex4.
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex3=off
blend.gbuffers_basic=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_terrain=off
blend.gbuffers_block=off

# --- Quality profiles ---------------------------------------------------------
profile.LOW=shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SAMPLES=4 !PCSS !COLORED_SHADOWS !SSAO SSAO_SAMPLES=4 SKY_STEPS=8 CLOUD_QUALITY=1 !VOLUMETRIC_LIGHT VL_STEPS=6 !WATER_SSR SSR_STEPS=12 !WAVING_LEAVES
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=12 PCSS COLORED_SHADOWS SSAO SSAO_SAMPLES=8 SKY_STEPS=12 CLOUD_QUALITY=2 VOLUMETRIC_LIGHT VL_STEPS=12 WATER_SSR SSR_STEPS=20 WAVING_LEAVES
profile.HIGH=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=24 PCSS COLORED_SHADOWS SSAO SSAO_SAMPLES=12 SKY_STEPS=16 CLOUD_QUALITY=3 VOLUMETRIC_LIGHT VL_STEPS=24 WATER_SSR SSR_STEPS=32 WAVING_LEAVES

# --- Option menu ------------------------------------------------------------------
screen=<profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [FOG] [WATER] [WAVING] [POST]
screen.columns=2
screen.LIGHTING=SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_BRIGHTNESS MIN_LIGHT BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_WARMTH EMISSIVE_BRIGHTNESS HANDHELD_LIGHT FOLIAGE_SSS ambientOcclusionLevel SSAO SSAO_STRENGTH SSAO_SAMPLES <empty> RAIN_WETNESS PUDDLES
screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS PCSS COLORED_SHADOWS SHADOW_DISTORTION sunPathRotation
screen.ATMOSPHERE=SKY_STEPS SUN_SIZE STAR_BRIGHTNESS <empty> CLOUD_QUALITY CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED VANILLA_CLOUDS
screen.FOG=VOLUMETRIC_LIGHT VL_STEPS VL_STRENGTH FOG_DENSITY MORNING_FOG RAIN_FOG BORDER_FOG <empty> NETHER_FOG_DENSITY END_FOG_DENSITY
screen.WATER=WATER_WAVES WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFRACTION WATER_SSR SSR_STEPS WATER_CLARITY UNDERWATER_FOG
screen.WAVING=WAVING_PLANTS WAVING_LEAVES WAVE_AMPLITUDE WAVE_SPEED
screen.POST=BLOOM BLOOM_STRENGTH AUTO_EXPOSURE EXPOSURE TONEMAP WHITE_BALANCE SATURATION VIBRANCE CONTRAST SHADOW_TINT VIGNETTE VIGNETTE_STRENGTH

sliders=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION sunPathRotation \
    SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_BRIGHTNESS MIN_LIGHT BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_WARMTH EMISSIVE_BRIGHTNESS FOLIAGE_SSS ambientOcclusionLevel SSAO_STRENGTH SSAO_SAMPLES \
    SKY_STEPS SUN_SIZE STAR_BRIGHTNESS CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED \
    VL_STEPS VL_STRENGTH FOG_DENSITY MORNING_FOG RAIN_FOG NETHER_FOG_DENSITY END_FOG_DENSITY \
    WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFRACTION SSR_STEPS WATER_CLARITY UNDERWATER_FOG \
    WAVE_AMPLITUDE WAVE_SPEED \
    BLOOM_STRENGTH EXPOSURE WHITE_BALANCE SATURATION VIBRANCE CONTRAST SHADOW_TINT VIGNETTE_STRENGTH
